<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント作成</title>
</head>
<body>

  <h1>イベント作成</h1>

  <label>
    イベント名
    <input id="title" type="text">
  </label>

  <br><br>

  <label>
    開始日
    <input id="startDate" type="date">
  </label>

  <br><br>

  <label>
    終了日
    <input id="endDate" type="date">
  </label>

  <br><br>

  <h2>回答項目</h2>

  <p>
    日程を分けて回答してほしい条件を設定してください。
  </p>

  <textarea
    id="questions"
    rows="5"
    placeholder="例：
対面
オンライン
第1会議室"
  ></textarea>

  <br><br>

  <button id="createButton">イベントを作成</button>

  <p id="status"></p>

  <script type="module">
  import {
    db,
    auth
  } from "./firebase.js";

  import {
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const button = document.getElementById("createButton");
  const status = document.getElementById("status");

  onAuthStateChanged(auth, user => {
    if (!user) {
      status.textContent =
        "管理者ログインが必要です。";
      button.disabled = true;
    } else {
      status.textContent =
        `ログイン中：${user.displayName}`;
      button.disabled = false;
    }
  });

  button.addEventListener("click", async () => {
    const title = document.getElementById("title").value.trim();
    const startDate = document.getElementById("startDate").value;
    const endDate = document.getElementById("endDate").value;
    const groupTitles = document.getElementById("questions").value
      .split("\n")
      .map(title => title.trim())
      .filter(title => title !== "");

    if (!title || !startDate || !endDate) {
      status.textContent = "全部入力してください";
      return;
    }

    if (groupTitles.length === 0) {
      status.textContent =
        "回答項目を1つ以上入力してください。";
      return;
    }

    const groups = groupTitles.map((title, index) => ({
      id: `group${index + 1}`,
      title: title
    }));

    try {
      if (!auth.currentUser) {
  status.textContent = "先にログインしてください。";
  return;
}

const docRef = await addDoc(collection(db, "events"), {
  title,
  startDate,
  endDate,
  ownerId: auth.currentUser.uid,
  isOpen: true,
  groups,
  createdAt: serverTimestamp()
});      const eventUrl =
  new URL(
    `./index.html?event=${docRef.id}`,
    window.location.href
  ).href;

      status.innerHTML = `
        作成成功！<br>
        参加者用URL：<br>
        <a href="${eventUrl}" target="_blank">
          ${eventUrl}
        </a>
      `;

    } catch (error) {
      console.error(error);
      status.textContent = "作成失敗";
    }
  });
</script>
</body>
</html>
