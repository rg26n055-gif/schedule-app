<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ログイン</title>
</head>
<body>

  <h1>管理者ログイン</h1>

  <button id="loginButton">
    Googleでログイン
  </button>

  <p id="status"></p>

  <script type="module">

    import {
      auth,
      provider
    } from "./firebase.js";

    import {
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const button =
      document.getElementById("loginButton");

    const status =
      document.getElementById("status");

    button.addEventListener(
      "click",
      async () => {

        try {

          const result =
            await signInWithPopup(
              auth,
              provider
            );

          const user =
            result.user;

          console.log(
            "ログイン成功:",
            user.uid
          );

          status.textContent =
            `ログイン成功：${user.displayName}`;

        } catch (error) {

          console.error(
            "ログインエラー:",
            error
          );

          status.textContent =
            "ログインに失敗しました。";
        }
      }
    );

  </script>

</body>
</html>
