<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者画面</title>
</head>
<body>

  <h1>管理者画面</h1>

  <p id="status">読み込み中...</p>

  <h2 id="eventTitle"></h2>

  <div id="responses"></div>

  <script type="module">

    import {
      db,
      auth
    } from "./firebase.js";

    import {
      doc,
      getDoc,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const params =
      new URLSearchParams(
        window.location.search
      );

    const eventId =
      params.get("event");

    const status =
      document.getElementById("status");

    const eventTitle =
      document.getElementById("eventTitle");

    const responses =
      document.getElementById("responses");


    onAuthStateChanged(
      auth,
      async user => {

        if (!user) {

          status.textContent =
            "管理者ログインが必要です。";

          return;
        }

        if (!eventId) {

          status.textContent =
            "イベントが指定されていません。";

          return;
        }

        try {

          const eventRef =
            doc(
              db,
              "events",
              eventId
            );

          const eventSnapshot =
            await getDoc(
              eventRef
            );

          if (!eventSnapshot.exists()) {

            status.textContent =
              "イベントが見つかりません。";

            return;
          }

          const eventData =
            eventSnapshot.data();

          if (
            eventData.ownerId !==
            user.uid
          ) {

            status.textContent =
              "このイベントを管理する権限がありません。";

            return;
          }

          eventTitle.textContent =
            eventData.title;

          const responsesRef =
            collection(
              db,
              "events",
              eventId,
              "responses"
            );

          const responseSnapshot =
            await getDocs(
              responsesRef
            );

          responses.innerHTML = "";

          responseSnapshot.forEach(
            documentSnapshot => {

              const data =
                documentSnapshot.data();

              const div =
                document.createElement(
                  "div"
                );

              div.innerHTML = `
                <hr>
                <strong>${escapeHtml(data.name || "")}</strong>
                <br>
                回答ID：
                ${documentSnapshot.id}
              `;

              responses.appendChild(
                div
              );
            }
          );

          status.textContent =
            `回答者数：${responseSnapshot.size}人`;

        } catch (error) {

          console.error(
            "管理画面エラー:",
            error
          );

          status.textContent =
            "データを読み込めませんでした。";
        }
      }
    );


    function escapeHtml(text) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        text;

      return div.innerHTML;
    }

  </script>

</body>
</html>
